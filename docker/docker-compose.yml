# Local development dependencies.
#
# The app itself runs on the host (`npm run start:dev`) for fast reload; only the
# stateful services live in Docker. Every version here is pinned to the same
# major used in staging and production so "works on my machine" stays true.

name: ticketit

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: ticketit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketit
      POSTGRES_PASSWORD: ticketit
      POSTGRES_DB: ticketit
      # Deterministic collation: index ordering must match production exactly.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      # Project-specific host ports. Developer machines frequently already run
      # PostgreSQL on 5432/5433; that service wins the binding and the app then
      # fails with an authentication error that looks like a wrong password.
      # Container-to-container traffic still uses the standard ports.
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketit -d ticketit']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: ticketit-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    # appendonly keeps queued jobs across a restart; losing them means losing
    # pending emails and webhook deliveries.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ticketit-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    command: ['server', '/data', '--console-address', ':9001']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the bucket the app expects so a fresh clone just works.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: ticketit-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ticketit-assets &&
      mc anonymous set download local/ticketit-assets &&
      echo 'bucket ready'
      "

  mailhog:
    image: axllent/mailpit:v1.21
    container_name: ticketit-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  redis-data:
  minio-data:
